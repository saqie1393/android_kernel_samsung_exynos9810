name: Build S9+ KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libelf-dev lld llvm \
            python3 unzip zip cpio rsync

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/clang/bin:$PATH

          mkdir -p out

          make O=out exynos9810-star2lte_defconfig

          make -j$(nproc) \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Collect Files
        run: |
          mkdir -p kernel_out

          find out/arch/arm64/boot -name "Image*" -exec cp {} kernel_out/ \;
          find out/arch/arm64/boot -name "*.dtb" -exec cp {} kernel_out/ \; || true
          find out/arch/arm64/boot -name "*.dtbo" -exec cp {} kernel_out/ \; || true

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: S9Plus-star2lte-KernelSU-Next
          path: kernel_out/
