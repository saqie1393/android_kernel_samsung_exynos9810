name: Build S9+ KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git wget \
            libssl-dev libelf-dev \
            python3 unzip zip cpio rsync \
            gcc-aarch64-linux-gnu

      - name: Clone AOSP Clang
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b android-11.0.0_r48 clang

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH=$PWD/clang/clang-r383902/bin:$PATH

          mkdir -p out

          make O=out exynos9810-star2lte_defconfig

          make -j$(nproc) \
            O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Collect Kernel Files
        run: |
          mkdir -p kernel_out

          find out/arch/arm64/boot -name "Image*" \
            -exec cp {} kernel_out/ \;

          find out/arch/arm64/boot -name "*.dtb" \
            -exec cp {} kernel_out/ \; || true

          find out/arch/arm64/boot -name "*.dtbo" \
            -exec cp {} kernel_out/ \; || true

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-S9Plus-star2lte-KernelSU-Next
          path: kernel_out/
